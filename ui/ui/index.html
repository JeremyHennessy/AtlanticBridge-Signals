<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AtlanticBridge Signals has moved</title>
    <link rel="canonical" href="../" />
  </head>
  <body>
    <p>Opening AtlanticBridge Signals… <a id="continue" href="../">Continue</a></p>
    <script>
      // Pages publishes ui/ at the site root. Keep old /ui/ bookmarks working.
      // URL fields preserve filters and deep links as data, never as HTML/code.
      const current = new URL(window.location.href);
      if (/\/ui\/(?:index\.html)?$/.test(current.pathname)) {
        const target = new URL("../", current);
        target.search = current.search;
        target.hash = current.hash;
        document.getElementById("continue").href = target.href;
        window.location.replace(target.href);
      }
    </script>
  </body>
</html>
