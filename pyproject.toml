[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticbridge-signals"
version = "0.1.0"
description = "Source-backed Canada-EU commercial expansion intelligence"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlanticbridge = ["sources/nl_assessment_fixture_records.json", "sources/halifax_permit_pinned_records.json", "automation/workbench_assets/*.html", "automation/workbench_assets/*.css", "automation/workbench_assets/*.js"]
