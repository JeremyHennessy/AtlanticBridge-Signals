name: Validate Curated Identity Review Batch 02

on:
  push:
    branches:
      - "feature/curated-reviews-015"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Rebuild identity chain and apply review batches
        run: |
          DB="$RUNNER_TEMP/curated-reviews-batch02.sqlite"

          python -m atlanticbridge ingest-investment-canada \
            --db "$DB" \
            --history \
            --workers 4

          python -m atlanticbridge resolve-entry-identities \
            --db "$DB" \
            --start-month 2019-01 \
            --end-month 2025-12 \
            --gold-limit 100 \
            --detail-limit 140 \
            --detail-delay-seconds 0.05

          python -m atlanticbridge resolve-foreign-identities \
            --db "$DB" \
            --page-size 20 \
            --delay-seconds 0.1

          python -m atlanticbridge build-curated-identity-queue --db "$DB"

          python -m atlanticbridge apply-curated-identity-review \
            --db "$DB" \
            --file reviews/curated_identity/2026-09-19-primary-batch-01.json

          RESULT="$(python -m atlanticbridge apply-curated-identity-review \
            --db "$DB" \
            --file reviews/curated_identity/2026-09-19-primary-batch-02.json)"
          echo "$RESULT"

          SUMMARY="$(python -m atlanticbridge summarize-curated-identity --db "$DB")"
          echo "$SUMMARY"

          RESULT="$RESULT" SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESULT"])
          summary = json.loads(os.environ["SUMMARY"])

          assert result["items_processed"] == 4, result
          assert result["evidence_rows_processed"] == 4, result
          assert result["decisions_processed"] == 4, result

          assert summary["active_queue_records"] == 26, summary
          assert summary["confirmed_reviews"] == 8, summary
          assert summary["confirmed_legal_entities"] == 8, summary
          assert summary["confirmed_natural_persons"] == 0, summary
          assert summary["modeling_ready_curated_records"] == 8, summary
          assert summary["open_reviews"] == 18, summary

          confirmed = [
              row for row in summary["queue"]
              if row["review_status"] == "CONFIRMED"
          ]
          assert len(confirmed) == 8, confirmed
          assert all(row["primary_evidence_count"] >= 1 for row in confirmed), confirmed
          assert all(row["resolved_subject_type"] == "LEGAL_ENTITY" for row in confirmed), confirmed

          batch02 = {
              "Framework Computer Consultants Ltd",
              "ConTeyor International NV",
              "SiOO WoodProtection Industry AB",
              "Pegasi Oy",
          }
          assert batch02.issubset(
              {row["resolved_subject_name"] for row in confirmed}
          ), confirmed
          PY
