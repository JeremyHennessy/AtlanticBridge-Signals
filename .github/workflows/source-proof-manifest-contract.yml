name: Source proof manifest contract\n\non:\n  pull_request:\n    paths:\n      - "scripts/validate_source_proof_manifests.py"\n      - "reviews/backtests/2026-09-21-cipo-researcher-manifest.json"\n      - "reviews/backtests/2026-09-21-canadabuys-historical-manifest.json"\n      - "reviews/backtests/2026-09-21-ted-historical-manifest.json"\n      - "reviews/backtests/source_proofs/**"\n      - ".github/workflows/source-proof-manifest-contract.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  manifest-contract:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Validate accepted evidence hashes\n        run: python scripts/validate_source_proof_manifests.py