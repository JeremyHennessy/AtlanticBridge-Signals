name: Source proof manifest contract

on:
  pull_request:
    paths:
      - "scripts/validate_source_proof_manifests.py"
      - "reviews/backtests/2026-09-21-cipo-journal-full-manifest.json"
      - "reviews/backtests/2026-09-21-cipo-researcher-manifest.json"
      - "reviews/backtests/2026-09-21-canadabuys-historical-manifest.json"
      - "reviews/backtests/2026-09-21-ted-historical-manifest.json"
      - "reviews/backtests/source_proofs/**"
      - ".github/workflows/source-proof-manifest-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate accepted evidence hashes
        run: python scripts/validate_source_proof_manifests.py