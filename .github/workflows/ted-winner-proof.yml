name: TED exact winner alias probe

on:
  push:
    branches:
      - "research/ted-winner-proof-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest tests.test_ted_winner_probe tests.test_ted -v

      - name: Run exact winner alias proof
        run: |
          mkdir -p control-output
          python scripts/probe_ted_winner_alias.py \
            --output control-output/ted-winner-proof.json

      - name: Validate complete alias query retrieval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("control-output/ted-winner-proof.json").read_text()
          )
          assert payload["summary"]["entity_count"] == 12
          assert payload["summary"]["alias_query_count"] >= 12
          assert (
              payload["summary"]["entities_with_complete_alias_queries"]
              == 12
          )
          assert all(
              row["all_alias_queries_complete"]
              for row in payload["entities"]
          )
          assert all(
              alias["complete"]
              and alias["timed_out"] is False
              and alias["returned_notice_count"]
                  == alias["total_notice_count"]
              for row in payload["entities"]
              for alias in row["aliases"]
          )
          PY

      - name: Retain TED proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ted-winner-proof-${{ github.sha }}
          path: control-output/
          retention-days: 90
          if-no-files-found: error