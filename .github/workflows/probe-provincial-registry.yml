name: Probe BC OrgBook API

on:
  push:
    branches:
      - "feature/provincial-identity-011"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe documented OrgBook v4 endpoints
        run: python scripts/probe_provincial_registry.py
