name: CORDIS Canada relationship positive probe

on:
  push:
    branches:
      - "research/cordis-positive-probe-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest tests.test_cordis_positive_probe tests.test_cordis -v

      - name: Restore CORDIS archive cache
        uses: actions/cache@v4
        with:
          path: control-output/cordis-cache
          key: cordis-horizon-projects-20260921-v1

      - name: Probe exact-alias Canada project relationships
        run: |
          mkdir -p control-output
          python scripts/probe_cordis_canada_relationships.py \
            --output control-output/cordis-positive-probe.json

      - name: Validate complete probe output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("control-output/cordis-positive-probe.json").read_text()
          )
          assert payload["summary"]["entity_count"] == 12
          assert payload["summary"]["participation_rows_scanned"] > 0
          assert payload["summary"]["project_rows_scanned"] > 0
          assert len(payload["entity_relationship_counts"]) == 12
          PY

      - name: Retain CORDIS probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cordis-positive-probe-${{ github.sha }}
          path: control-output/
          retention-days: 90
          if-no-files-found: error