name: Documentary outcome qualification tranche 2
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/atlanticbridge/outcome_qualification.py'
      - 'tests/test_outcome_qualification_round2.py'
      - 'reviews/commercial_validation/discovery-review-2-2026-09-22.json'
      - '.github/workflows/outcome-qualification-2-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression suites
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          node --test tests/test_workspace.cjs tests/test_reviewed.cjs
      - name: Two live captures on one isolated ledger
        run: |
          mkdir -p artifacts/outcome-qualification-2
          python scripts/probe_outcome_qualification.py --manifest reviews/commercial_validation/discovery-review-2-2026-09-22.json --output artifacts/outcome-qualification-2/first --state artifacts/outcome-qualification-2/state.sqlite
          python scripts/probe_outcome_qualification.py --manifest reviews/commercial_validation/discovery-review-2-2026-09-22.json --output artifacts/outcome-qualification-2/second --state artifacts/outcome-qualification-2/state.sqlite
      - name: Verify nine reviews and observation-clock preservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/outcome-qualification-2')
          a=json.loads((p/'first/reviewed-discovery.json').read_text())
          b=json.loads((p/'second/reviewed-discovery.json').read_text())
          assert a['summary']['documentary_reviewed_projects']==9
          assert b['summary']['documentary_reviewed_projects']==9
          assert b['summary']['first_entry_training_labels']==0
          assert b['summary']['new_public_alerts']==0
          first={r['id']:r['first_observed_at'] for r in a['records']}
          assert all(first[r['id']]==r['first_observed_at'] for r in b['records'])
          PY
      - name: Preserve exact tested source and evidence
        if: always()
        run: |
          mkdir -p artifacts/outcome-qualification-2
          git rev-parse HEAD > artifacts/outcome-qualification-2/tested-commit.txt
          git archive --format=tar.gz HEAD > artifacts/outcome-qualification-2/tested-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-qualification-2-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/outcome-qualification-2/
          retention-days: 90
          if-no-files-found: error
