name: Validate Statistics Canada Trade Production

on:
  push:
    branches:
      - "feature/statcan-008"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run full live Statistics Canada trade ingest
        run: |
          DB="$RUNNER_TEMP/statcan-live.sqlite"
          RESULT="$(python -m atlanticbridge ingest-statcan-trade --db "$DB" --source both)"
          echo "$RESULT"
          SUMMARY="$(python -m atlanticbridge summarize-statcan-trade --db "$DB")"
          echo "$SUMMARY"
          RESULT="$RESULT" SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESULT"])
          summary = json.loads(os.environ["SUMMARY"])

          assert len(result["tables"]) == 2, result
          tables = {row["source_pid"]: row for row in result["tables"]}

          monthly = tables["12100175"]
          annual = tables["12100173"]

          assert monthly["cadence"] == "monthly", monthly
          assert monthly["partner_count"] == 6, monthly
          assert monthly["geo_count"] == 2, monthly
          assert monthly["latest_ref_date"] == "2026-07", monthly
          assert monthly["filtered_records"] > 100000, monthly

          assert annual["cadence"] == "annual", annual
          assert annual["partner_count"] == 27, annual
          assert annual["geo_count"] == 2, annual
          assert annual["latest_ref_date"] == "2025", annual
          assert annual["filtered_records"] > 20000, annual

          assert summary["context_only"] is True, summary
          assert summary["monthly"]["partner_count"] == 6, summary
          assert summary["annual"]["partner_count"] == 27, summary
          assert len(summary["monthly"]["markets"]) >= 12, summary
          assert len(summary["annual"]["markets"]) == 54, summary
          assert summary["scoring_excluded_commodities"], summary
          PY
