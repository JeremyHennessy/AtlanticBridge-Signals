name: Validate TED Production Ingest

on:
  push:
    branches:
      - "feature/ted-005"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run full live TED award ingest
        run: |
          DB="$RUNNER_TEMP/ted-live.sqlite"
          RESULT="$(python -m atlanticbridge ingest-ted-awards \
            --db "$DB" \
            --start-date 2024-01-25 \
            --end-date 2024-01-25 \
            --scope ALL \
            --page-size 250)"
          echo "$RESULT"
          SUMMARY="$(python -m atlanticbridge summarize-ted --db "$DB")"
          echo "$SUMMARY"
          RESULT="$RESULT" SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESULT"])
          summary = json.loads(os.environ["SUMMARY"])

          assert result["total_notice_count"] > 500, result
          assert result["returned_notice_count"] == result["total_notice_count"], result
          assert summary["notices"] == result["returned_notice_count"], summary
          assert summary["winner_mentions"] > 0, summary
          assert (
              summary["aligned_winner_mentions"]
              + summary["unaligned_winner_mentions"]
              == summary["winner_mentions"]
          ), summary
          assert summary["search_runs"] == 1, summary
          PY
