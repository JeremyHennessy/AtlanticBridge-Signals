name: Probe Historical Outcome Cohort

on:
  push:
    branches:
      - "feature/historical-feasibility-009"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Measure Investment Canada outcome cohort
        run: python scripts/probe_historical_outcomes.py
