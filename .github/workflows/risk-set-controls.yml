name: Risk-set control acceptance

on:
  pull_request:
    paths:
      - "src/atlanticbridge/risk_set_controls.py"
      - "scripts/build_risk_set_controls.py"
      - "tests/test_risk_set_controls.py"
      - "reviews/control_cohorts/**"
      - "reviews/outcome_audit/2026-09-20-outcome-cohorts.json"
      - "reviews/outcome_audit/2026-09-20-cases.json"
      - "docs/RISK_SET_CONTROLS.md"
      - ".github/workflows/risk-set-controls.yml"
  workflow_dispatch:

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest tests.test_risk_set_controls -v

      - name: Build live complete-history risk set
        run: |
          mkdir -p control-output
          python scripts/build_risk_set_controls.py \
            --output control-output/2026-09-20-risk-set-controls.json \
            --manifest-output control-output/2026-09-20-risk-set-controls.manifest.json \
            --identity-review-output control-output/2026-09-20-risk-set-control-identity-review.json \
            --workers 4

      - name: Validate generated payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from atlanticbridge.risk_set_controls import validate_risk_set_controls

          generated = json.loads(
              Path("control-output/2026-09-20-risk-set-controls.json").read_text()
          )
          validate_risk_set_controls(generated)
          assert generated["summary"]["candidate_count"] == 7
          assert generated["summary"]["negative_labels_created"] == 0
          assert generated["summary"]["backtest_control_eligible_assignments"] == 0
          assert (
              generated["summary"]["identity_unreviewed_assignments"]
              == generated["summary"]["risk_set_candidate_assignments"]
          )

          pinned_manifest = Path(
              "reviews/control_cohorts/2026-09-20-risk-set-controls.manifest.json"
          )
          pinned_review = Path(
              "reviews/control_cohorts/2026-09-20-risk-set-control-identity-review.json"
          )
          if pinned_manifest.exists() or pinned_review.exists():
              if not (pinned_manifest.exists() and pinned_review.exists()):
                  raise SystemExit("Pinned control manifest/review queue must exist together")
              expected_manifest = json.loads(pinned_manifest.read_text())
              generated_manifest = json.loads(
                  Path(
                      "control-output/2026-09-20-risk-set-controls.manifest.json"
                  ).read_text()
              )
              expected_review = json.loads(pinned_review.read_text())
              generated_review = json.loads(
                  Path(
                      "control-output/2026-09-20-risk-set-control-identity-review.json"
                  ).read_text()
              )
              if generated_review != expected_review:
                  raise SystemExit(
                      "Pinned control identity-review queue differs from the build"
                  )

              for field in (
                  "design",
                  "horizon_months",
                  "max_controls_per_candidate",
                  "summary",
              ):
                  if generated_manifest.get(field) != expected_manifest.get(field):
                      raise SystemExit(
                          f"Pinned risk-set manifest semantic field differs: {field}"
                      )

              volatile_source_fields = {"snapshot_manifest_sha256"}
              expected_source = {
                  key: value
                  for key, value in expected_manifest["source_proof"].items()
                  if key not in volatile_source_fields
              }
              generated_source = {
                  key: value
                  for key, value in generated_manifest["source_proof"].items()
                  if key not in volatile_source_fields
              }
              if generated_source != expected_source:
                  raise SystemExit(
                      "Pinned risk-set source coverage differs from live build"
                  )

              expected_semantic_hash = expected_manifest.get(
                  "semantic_payload_canonical_sha256"
              )
              generated_semantic_hash = generated_manifest.get(
                  "semantic_payload_canonical_sha256"
              )
              if not expected_semantic_hash:
                  raise SystemExit(
                      "Pinned manifest lacks semantic payload hash; "
                      f"generated={generated_semantic_hash}"
                  )
              if generated_semantic_hash != expected_semantic_hash:
                  raise SystemExit(
                      "Pinned risk-set semantic payload differs from live build"
                  )
          PY

      - name: Retain control proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-set-controls-${{ github.event.pull_request.head.sha || github.sha }}
          path: control-output/
          retention-days: 90
          if-no-files-found: error
