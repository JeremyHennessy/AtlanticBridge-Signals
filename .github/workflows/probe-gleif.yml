name: Probe GLEIF API

on:
  push:
    branches:
      - "feature/gleif-004"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe live GLEIF search filters
        run: python scripts/probe_gleif.py
