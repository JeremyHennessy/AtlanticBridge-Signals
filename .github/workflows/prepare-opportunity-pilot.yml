name: Prepare exact isolated opportunity pilot candidate
on:
  push:
    branches: [feature/opportunity-pilot-20260922]
    paths: [.github/workflows/prepare-opportunity-pilot.yml]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally tested source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'feature/opportunity-pilot-20260922'
          test "$(git rev-parse HEAD^)" = 'c9aac8dc9aefd5c537a749abfe60a032979d0b66'
          python - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          shas=['14faaa2ac5a64995e14ed087923b53e31f295f33','fdeaaa6fdfb94f33e02e7497adc5b9cb587cf596','100099078929ac03a0c72aeb52e7726d0940e610']
          parts=[]
          for sha in shas:
              blob=json.loads(subprocess.check_output(['gh','api','/repos/JeremyHennessy/AtlanticBridge-Signals/git/blobs/'+sha]))
              raw=base64.b64decode(blob['content']);assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              parts.append(raw)
          patch=gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest()=='d7893c2564d6576e3bd8e280804778856f000afd4d6e060d3fc27428098de152'
          Path('/tmp/pilot.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--exclude=.github/workflows/*','/tmp/pilot.patch'],check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','/tmp/pilot.patch'],check=True)
          PY
      - name: Regenerate source-bound data and run all regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api '/repos/JeremyHennessy/AtlanticBridge-Signals/actions/artifacts/10724340100/zip' > "$RUNNER_TEMP/documentary.zip"
          gh api '/repos/JeremyHennessy/AtlanticBridge-Signals/actions/artifacts/10720884358/zip' > "$RUNNER_TEMP/monitor.zip"
          python -m pip install -e .
          python scripts/build_pilot_release.py --documentary-proof "$RUNNER_TEMP/documentary.zip" --monitor-proof "$RUNNER_TEMP/monitor.zip"
          python scripts/build_pilot_release.py --documentary-proof "$RUNNER_TEMP/documentary.zip" --monitor-proof "$RUNNER_TEMP/monitor.zip" --check
          python -m unittest discover -s tests -q
          node --test tests/test_workspace.cjs tests/test_reviewed.cjs tests/test_opportunities.cjs
          git diff --check
      - name: Preserve originals and commit only isolated branch
        run: |
          git diff --exit-code c9aac8dc9aefd5c537a749abfe60a032979d0b66 -- ui/styles.css ui/workspace.css ui/workspace.js ui/workbench.js ui/data/dashboard.json ui/data/live-signals.json src/atlanticbridge/company_sources.py scripts/probe_company_sources.py
          git rm .github/workflows/prepare-opportunity-pilot.yml
          git add docs/OPPORTUNITY_RELEASE_2026_09_22.md docs/PILOT_OPERATOR_PACKET_2026_09_22.md reviews/pilot scripts/build_pilot_release.py scripts/analyse_pilot.py src/atlanticbridge/pilot_measurement.py tests/opportunities_acceptance.mjs tests/test_opportunities.cjs tests/test_pilot_measurement.py tests/test_pilot_release.py tests/test_reviewed.cjs tests/ui_visual_acceptance.mjs ui/app.js ui/index.html ui/opportunities.js ui/reviewed.js ui/data/company-reviews.json ui/data/reviewed-evidence.json
          git config user.name 'AtlanticBridge pilot release'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Connect evidence review queue, fifteen dossiers, explicit triage and measured pilot workflow'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD
