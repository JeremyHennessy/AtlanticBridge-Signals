name: Finalize pilot unavailable-data guards
on:
  push:
    branches: [feature/analyst-workbench-20260922]
    paths: [.github/workflows/repair-pilot-guards.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact observed failure-path guards on branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          assert os.environ['GITHUB_REF']=='refs/heads/feature/analyst-workbench-20260922'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='2f8b521f6f60a8b56248708f2f8f8306948f417b'
          p=Path('ui/app.js');s=p.read_text()
          for old,new in [
           ('function renderCases() {\n','function renderCases() {\n  if(!state.data){els.caseCountLabel.textContent="Data unavailable—not zero cases";return;}\n'),
           ('function renderResearch() {\n','function renderResearch() {\n  if(!state.data)return;\n'),
           ('function loadSaved() {\n','function loadSaved() {\n  if(!state.data)return;\n'),
           ('function toggleSaved(id) {\n','function toggleSaved(id) {\n  if(!state.data)return;\n')]:
              assert s.count(old)==1
              s=s.replace(old,new)
          p.write_text(s)
          p=Path('tests/workspace_acceptance.mjs');s=p.read_text()
          old="  const backupDownload=p.waitForEvent('download');"
          new="  await p.screenshot({path:path.join(out,`${label}-worklist-fixture.png`),fullPage:true});\n"+old
          assert s.count(old)==1
          s=s.replace(old,new)
          old="  await context.route('**/data/live-signals.json',r=>r.fulfill({status:503,body:'unavailable'}));"
          new="\n".join([
           "  await hash(p,'#companies');await p.locator('#case-search').fill('cannot search unavailable history');",
           "  await hash(p,'#research');await p.locator('#research-search').fill('cannot search unavailable research');",
           "  check(`${label}: unavailable historical controls fail closed`,errors.length===0,errors.join(' | '));",
           "  await hash(p,'#worklist');",
          ])+'\n'+old
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python -m pip install -e .
          python -m unittest discover -s tests -q
          node --test tests/test_workspace.cjs
          node --check ui/app.js
          node --check tests/workspace_acceptance.mjs
          git diff --check
      - name: Commit only application and regression files to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/app.js tests/workspace_acceptance.mjs
          git commit -m 'Guard historical controls during source failure and retain worklist captures'
          git push origin HEAD:feature/analyst-workbench-20260922
