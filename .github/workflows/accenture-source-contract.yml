name: Accenture source contract verification
on:
  push:
    branches:
      - fix/reliability-archive-pilot-20261104
    paths:
      - reviews/company_sources/pilot-2026-09-22.json
      - src/atlanticbridge/company_sources.py
      - tests/test_company_sources.py
      - .github/workflows/accenture-source-contract.yml
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Run offline company-source parser tests
        run: python -m unittest discover -s tests -p test_company_sources.py -v
