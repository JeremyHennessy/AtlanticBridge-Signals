name: Probe GLEIF Parent Relationships

on:
  push:
    branches:
      - "feature/foreign-parent-identity-012"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe direct and ultimate parent contracts
        run: python scripts/probe_foreign_parent.py
