name: Probe Entrant Entity Gold Cohort

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Measure federal Canadian entry-entity coverage
        run: python scripts/probe_entry_entity.py
