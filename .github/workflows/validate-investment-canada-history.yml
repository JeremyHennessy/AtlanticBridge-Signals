name: Validate Investment Canada Historical Backfill

on:
  push:
    branches:
      - "feature/historical-feasibility-009"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run full historical production ingest
        run: |
          DB="$RUNNER_TEMP/investment-canada-history.sqlite"
          RESULT="$(python -m atlanticbridge ingest-investment-canada             --db "$DB"             --history             --workers 4)"
          echo "$RESULT"

          SUMMARY="$(python -m atlanticbridge summarize-investment-canada --db "$DB")"
          echo "$SUMMARY"

          RESULT="$RESULT" SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESULT"])
          summary = json.loads(os.environ["SUMMARY"])

          assert result["mode"] == "history", result
          assert result["bucket_count"] == 36, result
          assert result["page_count"] >= 681, result
          assert result["records_seen"] >= 33106, result
          assert result["duplicate_appearances"] > 0, result
          assert result["unique_records"] >= 32369, result
          assert result["records_stored"] == result["unique_records"], result
          assert result["page_snapshots"] == result["page_count"], result

          assert summary["total_records"] == result["unique_records"], summary
          assert summary["records_with_investor_node_id"] == summary["total_records"], summary
          assert summary["earliest_month"] <= "1984-04", summary
          assert summary["latest_month"] >= "2026-07", summary
          assert summary["eu27_new_business_records"] > 1700, summary
          assert summary["eu27_new_business_unique_investor_nodes"] > 1500, summary
          assert len(summary["eu27_new_business_by_year"]) >= 40, summary
          PY
