name: Deploy Evidence Console to GitHub Pages

on:
  push:
    branches: [main]
    # The legacy publisher runs on every main push. Do not leave it unopposed
    # on documentation/research commits while Pages remains branch-based.
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Verify deterministic evidence payloads
        run: |
          python -m unittest tests.test_ui_payload tests.test_live_signals -v
          python scripts/build_ui_payload.py

      - name: Refresh current CanadaBuys live signals
        run: |
          set +e
          rm -f /tmp/atlanticbridge-live.sqlite /tmp/live-signals.json
          python -m atlanticbridge ingest-canadabuys-awards             --db /tmp/atlanticbridge-live.sqlite
          ingest_status=$?
          if [ "$ingest_status" -eq 0 ]; then
            python scripts/build_live_signals.py               --db /tmp/atlanticbridge-live.sqlite               --output /tmp/live-signals.json               --lookback-days 365
            build_status=$?
          else
            build_status=1
          fi
          set -e

          if [ "$ingest_status" -eq 0 ] && [ "$build_status" -eq 0 ] && [ -s /tmp/live-signals.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/live-signals.json").read_text())
          assert p["status"] == "ACTIVE"
          assert p["summary"]["signal_count"] > 0
          assert p["summary"]["company_count"] > 0
          assert all(x["signal_family"] == "CANADABUYS_AWARD" for x in p["signals"])
          assert all(x["source_confidence"] == "SOURCE_CONFIRMED" for x in p["signals"])
          print(json.dumps({"generated_at":p["generated_at"],"source":p["source"],"summary":p["summary"]},indent=2))
          PY
            mv /tmp/live-signals.json ui/data/live-signals.json
          else
            echo "::error::Current CanadaBuys refresh failed. Aborting custom Pages deployment."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact UI artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ui

      - name: Wait for legacy Pages publisher to settle
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/pages" \
            --jq '.build_type // "legacy"')"

          case "$build_type" in
            workflow)
              echo "Pages uses Actions publishing; no legacy publisher to wait for."
              exit 0
              ;;
            legacy) ;;
            *)
              echo "::error::Unrecognized Pages build type: $build_type"
              exit 1
              ;;
          esac

          echo "Waiting for legacy Pages publication of ${GITHUB_SHA} before deploying the generated feed."
          for attempt in $(seq 1 60); do
            state="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")] | sort_by(.id) | last | .status // ""')"
            if [ "$state" = "completed" ]; then
              echo "Legacy publisher completed; custom deployment may proceed."
              exit 0
            fi
            echo "Legacy publisher: ${state:-not-visible-yet} ($attempt/60)"
            sleep 5
          done
          echo "::error::Legacy publisher did not settle; refusing to race production deployments."
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  hosted-acceptance:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact deployed revision
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Verify hosted desktop and iPhone UI
        env:
          UI_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          REQUIRE_LIVE_SIGNALS: "1"
        run: node tests/ui_visual_acceptance.mjs

      - name: Upload hosted acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-ui-acceptance-${{ github.sha }}
          path: artifacts/ui-acceptance/
          retention-days: 30
          if-no-files-found: error
