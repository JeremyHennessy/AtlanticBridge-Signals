name: Deploy Evidence Console to GitHub Pages\n\non:\n  push:\n    branches: [main]\n    paths:\n      - "ui/**"\n      - "scripts/build_ui_payload.py"\n      - "reviews/outcome_audit/**"\n      - "tests/ui_visual_acceptance.mjs"\n      - ".github/workflows/pages.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: github-pages\n  cancel-in-progress: false\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout exact revision\n        uses: actions/checkout@v6\n\n      - name: Set up Python\n        uses: actions/setup-python@v6\n        with:\n          python-version: "3.12"\n\n      - name: Install project\n        run: python -m pip install -e .\n\n      - name: Rebuild deterministic UI payload\n        run: |\n          python scripts/build_ui_payload.py\n          git diff --exit-code -- ui/data/dashboard.json\n\n      - name: Configure Pages\n        uses: actions/configure-pages@v5\n\n      - name: Upload exact UI artifact\n        uses: actions/upload-pages-artifact@v4\n        with:\n          path: ui\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    outputs:\n      page_url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n\n  hosted-acceptance:\n    needs: deploy\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - name: Checkout exact deployed revision\n        uses: actions/checkout@v6\n\n      - name: Set up Node\n        uses: actions/setup-node@v6\n        with:\n          node-version: "22"\n\n      - name: Install Playwright\n        run: |\n          npm install --no-save playwright@1.55.0\n          npx playwright install --with-deps chromium webkit\n\n      - name: Verify hosted desktop and iPhone UI\n        env:\n          UI_BASE_URL: ${{ needs.deploy.outputs.page_url }}\n        run: node tests/ui_visual_acceptance.mjs\n\n      - name: Upload hosted acceptance screenshots\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: hosted-ui-acceptance-${{ github.sha }}\n          path: artifacts/ui-acceptance/\n          retention-days: 30\n          if-no-files-found: error