name: Deploy Evidence Console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "scripts/build_ui_payload.py"
      - "reviews/outcome_audit/**"
      - "tests/ui_visual_acceptance.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Rebuild deterministic UI payload
        run: |
          python scripts/build_ui_payload.py
          git diff --exit-code -- ui/data/dashboard.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact UI artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ui

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  hosted-acceptance:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact deployed revision
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Verify hosted desktop and iPhone UI
        env:
          UI_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tests/ui_visual_acceptance.mjs

      - name: Upload hosted acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-ui-acceptance-${{ github.sha }}
          path: artifacts/ui-acceptance/
          retention-days: 30
          if-no-files-found: error