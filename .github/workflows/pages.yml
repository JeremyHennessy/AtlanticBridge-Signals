name: Deploy Evidence Console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ui/**"
      - "src/atlanticbridge/live_signals.py"
      - "src/atlanticbridge/canadabuys_store.py"
      - "src/atlanticbridge/sources/canadabuys.py"
      - "scripts/build_ui_payload.py"
      - "scripts/build_live_signals.py"
      - "reviews/outcome_audit/**"
      - "tests/test_live_signals.py"
      - "tests/ui_visual_acceptance.mjs"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Verify deterministic evidence payloads
        run: |
          python -m unittest tests.test_ui_payload tests.test_live_signals -v
          python scripts/build_ui_payload.py

      - name: Refresh current CanadaBuys live signals
        run: |
          set +e
          rm -f /tmp/atlanticbridge-live.sqlite /tmp/live-signals.json
          python -m atlanticbridge ingest-canadabuys-awards             --db /tmp/atlanticbridge-live.sqlite
          ingest_status=$?
          if [ "$ingest_status" -eq 0 ]; then
            python scripts/build_live_signals.py               --db /tmp/atlanticbridge-live.sqlite               --output /tmp/live-signals.json               --lookback-days 365
            build_status=$?
          else
            build_status=1
          fi
          set -e

          if [ "$ingest_status" -eq 0 ] && [ "$build_status" -eq 0 ] && [ -s /tmp/live-signals.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/live-signals.json").read_text())
          assert p["status"] == "ACTIVE"
          assert p["summary"]["signal_count"] > 0
          assert p["summary"]["company_count"] > 0
          assert all(x["signal_family"] == "CANADABUYS_AWARD" for x in p["signals"])
          assert all(x["source_confidence"] == "SOURCE_CONFIRMED" for x in p["signals"])
          print(json.dumps({"generated_at":p["generated_at"],"source":p["source"],"summary":p["summary"]},indent=2))
          PY
            mv /tmp/live-signals.json ui/data/live-signals.json
          else
            echo "::error::Current CanadaBuys refresh failed. Aborting Pages deployment so the previously hosted feed remains in place."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact UI artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ui

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  hosted-acceptance:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact deployed revision
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Verify hosted desktop and iPhone UI
        env:
          UI_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          REQUIRE_LIVE_SIGNALS: "1"
        run: node tests/ui_visual_acceptance.mjs

      - name: Upload hosted acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-ui-acceptance-${{ github.sha }}
          path: artifacts/ui-acceptance/
          retention-days: 30
          if-no-files-found: error
