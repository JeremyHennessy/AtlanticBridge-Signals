name: Probe Open Curated Identity Queue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Rebuild identity chain and print open queue
        run: |
          DB="$RUNNER_TEMP/curated-open.sqlite"

          python -m atlanticbridge ingest-investment-canada             --db "$DB"             --history             --workers 4

          python -m atlanticbridge resolve-entry-identities             --db "$DB"             --start-month 2019-01             --end-month 2025-12             --gold-limit 100             --detail-limit 140             --detail-delay-seconds 0.05

          python -m atlanticbridge resolve-foreign-identities             --db "$DB"             --page-size 20             --delay-seconds 0.1

          python -m atlanticbridge build-curated-identity-queue             --db "$DB"

          python -m atlanticbridge apply-curated-identity-review             --db "$DB"             --file reviews/curated_identity/2026-09-19-primary-batch-01.json

          python -m atlanticbridge apply-curated-identity-review             --db "$DB"             --file reviews/curated_identity/2026-09-19-primary-batch-02.json

          python -m atlanticbridge summarize-curated-identity             --db "$DB" > "$RUNNER_TEMP/summary.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "summary.json").read_text()
          )
          open_rows = [
              row for row in summary["queue"]
              if row["review_status"] == "OPEN"
          ]
          print(json.dumps({
              "active_queue_records": summary["active_queue_records"],
              "confirmed_reviews": summary["confirmed_reviews"],
              "modeling_ready_curated_records": summary["modeling_ready_curated_records"],
              "open_reviews": summary["open_reviews"],
              "open_queue": open_rows,
          }, indent=2, sort_keys=True))
          assert summary["confirmed_reviews"] == 8, summary
          assert summary["open_reviews"] == 18, summary
          assert len(open_rows) == 18, open_rows
          PY
