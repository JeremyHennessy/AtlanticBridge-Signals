name: CIPO source proof

on:
  pull_request:
    paths:
      - "scripts/collect_backtest_cipo.py"
      - "scripts/build_source_proof_artifact.py"
      - "tests/test_cipo_backtest_collector.py"
      - "tests/test_source_proof_artifact.py"
      - "reviews/backtests/2026-09-21-backtest-entities.json"
      - "reviews/backtests/source_proofs/2026-09-21-cipo-researcher-evidence.json"
      - ".github/workflows/source-proof-cipo.yml"
  workflow_dispatch:

concurrency:
  group: cipo-source-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cipo-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest tests.test_cipo_backtest_collector tests.test_source_proof_artifact -v
      - name: Restore CIPO bulk cache
        uses: actions/cache@v4
        with:
          path: source-output/cipo-cache
          key: cipo-researcher-2025-01-28-v1
      - name: Collect CIPO researcher proof
        run: |
          mkdir -p source-output source-proof-output
          python scripts/collect_backtest_cipo.py \
            --cache-dir source-output/cipo-cache \
            --output source-output/cipo-live.json
      - name: Normalize and compare accepted CIPO proof
        run: |
          python scripts/build_source_proof_artifact.py \
            --source cipo \
            --input source-output/cipo-live.json \
            --output source-proof-output/cipo-researcher-evidence.json \
            --expected reviews/backtests/source_proofs/2026-09-21-cipo-researcher-evidence.json
          sha256sum source-proof-output/cipo-researcher-evidence.json
      - name: Validate fail-closed CIPO boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("source-proof-output/cipo-researcher-evidence.json").read_text())
          assert p["summary"]["event_rows_scanned"] == 23244288
          assert p["summary"]["advertised_evidence_count"] == 19
          assert len(p["records"]) == 5
          assert p["known_coverage_gap"]["application_number"] == "1799092"
          assert p["known_coverage_gap"]["absence_inference_allowed"] is False
          assert all(row["coverage_status"] == "PRESENCE_ONLY_KNOWN_GAP" for row in p["coverage"])
          PY
      - name: Upload compact CIPO proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipo-source-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: source-proof-output/
          retention-days: 90
          if-no-files-found: error