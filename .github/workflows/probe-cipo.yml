name: Probe CIPO Trademark CSV

on:
  push:
    branches:
      - "feature/cipo-006"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test system TLS trust against CIPO bulk host
        run: |
          curl --fail --show-error --silent --head --max-time 30             "https://opic-cipo.ca/cipo/client_downloads/TM_CSV_2025_01_28/TM_application_main_2025-01-28.zip"
          curl --fail --show-error --silent --head --max-time 30             "https://opic-cipo.ca/cipo/client_downloads/TM_CSV_2025_01_28/TM_interested_party_2025-01-28.zip"
      - name: Probe CIPO quarterly trademark schemas
        run: python scripts/probe_cipo.py
