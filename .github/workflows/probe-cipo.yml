name: Probe CIPO Trademark Search

on:
  push:
    branches:
      - "feature/cipo-006"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe current CIPO trademark search form contract
        run: python scripts/probe_cipo.py
