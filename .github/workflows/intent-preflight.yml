name: Intent source preflight (branch only)
on:
  push:
    branches: [feature/intent-validation-delivery-20260922]
    paths: [.github/workflows/intent-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain exact repository and bounded public responses
        run: |
          mkdir -p artifacts/preflight/raw
          git archive --format=tar.gz HEAD > artifacts/preflight/repository.tar.gz
          python - <<'PY'
          import json, hashlib, urllib.request, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone
          targets = {
            'greenhouse-doc': 'https://docs.greenhouse.io/job-board.html',
            'ashby-doc': 'https://developers.ashbyhq.com/docs/public-job-posting-api',
            'adyen-jobs': 'https://boards-api.greenhouse.io/v1/boards/adyen/jobs?content=true',
            'backbase-jobs': 'https://boards-api.greenhouse.io/v1/boards/backbase/jobs?content=true',
            'mollie-jobs': 'https://boards-api.greenhouse.io/v1/boards/mollie/jobs?content=true',
            'mistral-jobs': 'https://api.ashbyhq.com/posting-api/job-board/mistral.ai',
            'adyen-careers': 'https://careers.adyen.com/vacancies',
            'backbase-careers': 'https://www.backbase.com/careers/jobs',
            'mollie-careers': 'https://jobs.mollie.com/',
            'mistral-careers': 'https://mistral.ai/careers/',
            'sap-rss': 'https://news.sap.com/feed/',
            'sap-news': 'https://news.sap.com/',
            'sap-robots': 'https://news.sap.com/robots.txt',
            'adyen-legal': 'https://www.adyen.com/legal',
            'backbase-legal': 'https://www.backbase.com/terms-and-conditions',
            'mistral-legal': 'https://mistral.ai/terms/'
          }
          report=[]
          for key,url in targets.items():
            row={'id':key,'requested_url':url,'observed_at':datetime.now(timezone.utc).isoformat()}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'AtlanticBridge-SourceProof/1.0 (+https://github.com/JeremyHennessy/AtlanticBridge-Signals)'})
              with urllib.request.urlopen(req,timeout=25) as response:
                raw=response.read(12000001)
                if len(raw)>12000000: raise ValueError('response exceeds bounded proof size')
                row.update(status=response.status,final_url=response.url,content_type=response.headers.get('Content-Type'),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
              Path('artifacts/preflight/raw/'+key+'.raw').write_bytes(raw)
              if 'jobs' in key:
                data=json.loads(raw)
                jobs=data.get('jobs',[]) if isinstance(data,dict) else data
                row['records']=len(jobs)
                row['root_keys']=list(data) if isinstance(data,dict) else []
                row['sample_keys']=list(jobs[0]) if jobs else []
                row['canada_location_samples']=[{'id':j.get('id'),'title':j.get('title'),'location':j.get('location'),'url':j.get('absolute_url',j.get('jobUrl'))} for j in jobs if any(x in str(j.get('location','')).casefold() for x in ['canada','toronto','montreal','vancouver'])][:8]
            except Exception as exc:
              row['error']=type(exc).__name__+': '+str(exc)
            report.append(row)
            print(json.dumps(row,ensure_ascii=False))
          Path('artifacts/preflight/report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intent-preflight-${{ github.sha }}
          path: artifacts/preflight/
          retention-days: 7
          if-no-files-found: error
