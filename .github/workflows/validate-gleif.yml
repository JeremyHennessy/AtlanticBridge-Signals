name: Validate GLEIF Production Resolution

on:
  push:
    branches:
      - "feature/gleif-004"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Resolve live CORDIS organizations against GLEIF
        run: |
          DB="$RUNNER_TEMP/gleif-live.sqlite"
          python -m atlanticbridge ingest-cordis --db "$DB"
          RESULT="$(python -m atlanticbridge resolve-cordis-gleif --db "$DB" --limit 10 --page-size 5 --delay-seconds 0.05)"
          echo "$RESULT"
          SUMMARY="$(python -m atlanticbridge summarize-gleif --db "$DB")"
          echo "$SUMMARY"
          RESULT="$RESULT" SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESULT"])
          summary = json.loads(os.environ["SUMMARY"])
          assert result["targets_queried"] == 10, result
          assert sum(result["status_counts"].values()) == 10, result
          assert result["golden_copy_publish_dates"], result
          assert summary["source_entities"] == 10, summary
          assert summary["queries"] == 10, summary
          assert summary["candidate_rows"] > 0, summary
          PY
