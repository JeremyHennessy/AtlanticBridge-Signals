name: Repair exact archive media contract
on:
  push:
    branches: [feature/evidence-retention-20260922]
    paths: [.github/workflows/repair-archive-media.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct endpoint media type without changing authentication
        run: |
          test "$GITHUB_REF_NAME" = 'feature/evidence-retention-20260922'
          test "$(git rev-parse HEAD^)" = '0b223cfe39f5bfc551cd56ee60800f81fada5591'
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/archive_evidence.py');s=p.read_text()
          old="'Accept':'application/octet-stream' if binary else 'application/vnd.github+json'"
          assert s.count(old)==1
          s=s.replace(old,"'Accept':'application/octet-stream' if binary and '/releases/assets/' in parsed.path else 'application/vnd.github+json'")
          p.write_text(s)
          p=Path('tests/test_evidence_archive.py');s=p.read_text();s+='''
              def test_download_accept_header_matches_endpoint_contract(self):
                  from unittest.mock import MagicMock
                  client=a.Client('TEST')
                  response=MagicMock();response.__enter__.return_value=response
                  response.status=200;response.read.return_value=b'bytes'
                  client.opener.open=MagicMock(return_value=response)
                  for suffix,expected in [('/actions/artifacts/1/zip','application/vnd.github+json'),('/releases/assets/1','application/octet-stream'),('/releases/1','application/vnd.github+json')]:
                      client.request(a.API+suffix,binary=True)
                      req=client.opener.open.call_args.args[0]
                      self.assertEqual(req.get_header('Accept'),expected)
          ''';p.write_text(s)
          PY
          python -m pip install -e .
          python -m unittest discover -s tests -q
          node --test tests/test_workspace.cjs tests/test_reviewed.cjs tests/test_opportunities.cjs
          git diff --check
      - name: Remove helper and commit only archive repair
        run: |
          git rm .github/workflows/repair-archive-media.yml
          git add scripts/archive_evidence.py tests/test_evidence_archive.py
          git config user.name 'AtlanticBridge evidence retention'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Use GitHub artifact redirect media contract while preserving release byte downloads'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
