name: CIPO Journal full completeness scan

on:
  push:
    branches:
      - "research/cipo-journal-full-scan-*"
  workflow_dispatch:

concurrency:
  group: cipo-journal-full-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: y2000_2003
            start_year: 2000
            end_year: 2003
          - label: y2004_2007
            start_year: 2004
            end_year: 2007
          - label: y2008_2011
            start_year: 2008
            end_year: 2011
          - label: y2012_2015
            start_year: 2012
            end_year: 2015
          - label: y2016_2019
            start_year: 2016
            end_year: 2019
          - label: y2020_2023
            start_year: 2020
            end_year: 2023
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and PDF text extractor
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Unit tests
        run: |
          python -m unittest \
            tests.test_cipo_journal \
            tests.test_cipo_journal_full_scan \
            -v

      - name: Scan official Journal shard
        run: |
          mkdir -p journal-shards
          python scripts/scan_cipo_journal_shard.py \
            --start-year ${{ matrix.start_year }} \
            --end-year ${{ matrix.end_year }} \
            --output journal-shards/shard-${{ matrix.label }}.json

      - name: Validate shard structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path("journal-shards/shard-${{ matrix.label }}.json")
          payload=json.loads(path.read_text())
          summary=payload["summary"]
          assert payload["design"] == "CIPO_JOURNAL_FULL_SCAN_SHARD"
          assert payload["alias_contract"]["entity_count"] == 12
          assert payload["alias_contract"]["alias_count"] >= 12
          assert (
              summary["issues_scanned"] + summary["issue_failures"]
              == summary["issues_in_inventory"]
          )
          assert len(payload["issue_proof"]) == summary["issues_scanned"]
          PY

      - name: Upload compact shard proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipo-journal-shard-${{ matrix.label }}
          path: journal-shards/shard-${{ matrix.label }}.json
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Download shard proofs
        uses: actions/download-artifact@v4
        with:
          pattern: cipo-journal-shard-*
          path: journal-shards
          merge-multiple: true

      - name: Aggregate full Journal proof
        run: |
          mkdir -p journal-output
          python scripts/aggregate_cipo_journal_full_scan.py \
            --shard-dir journal-shards \
            --output journal-output/cipo-journal-full-proof.json

      - name: Enforce full completeness gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("journal-output/cipo-journal-full-proof.json").read_text())
          s=p["summary"]
          g=p["gate"]
          i=p["inventory"]

          assert i["issue_count"] == 1221, i
          assert i["canonical_issue_sha256"] == (
              "8a89eccf0c368e82de4fcd62bea62481930210b7ddf2c182b18e7f45e7521a2d"
          )
          assert s["complete_issue_count"] == 1221, s
          assert s["issue_failure_count"] == 0, g["issue_failures"][:20]
          assert s["unresolved_alias_occurrence_count"] == 0, (
              g["unresolved_alias_occurrences"][:20]
          )
          assert g["structural_errors"] == [], g["structural_errors"]
          assert g["missing_required_cases"] == [], g["missing_required_cases"]
          assert g["passed"] is True
          assert s["absence_inference_allowed"] is True
          assert all(
              row["absence_coverage_proven"] is True
              for row in p["coverage"]
          )

          recovered={
              (row["application_number"], row["publicly_available_date"])
              for row in p["records"]
          }
          for required in {
              ("1336566", "2008-02-20"),
              ("1799092", "2018-12-12"),
              ("1702825", "2016-07-06"),
          }:
              assert required in recovered, (required, sorted(recovered)[:20])
          PY

      - name: Upload aggregate Journal proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipo-journal-full-proof-${{ github.sha }}
          path: journal-output/
          retention-days: 90
          if-no-files-found: error