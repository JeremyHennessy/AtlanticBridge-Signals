name: Cancel Superseded Curated Probe

on:
  push:
    branches:
      - "feature/curated-reviews-016"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only superseded open-queue run if still active
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "35484106159"
        run: |
          STATUS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"

          echo "Superseded run status: $STATUS"

          case "$STATUS" in
            queued|in_progress|waiting|pending|requested)
              curl --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel"
              echo "Cancellation requested for $RUN_ID"
              ;;
            *)
              echo "No cancellation needed"
              ;;
          esac
