name: Current CIPO observation proof

on:
  pull_request:
    branches: [main]
    paths:
      - "src/atlanticbridge/current_cipo.py"
      - "scripts/probe_current_cipo.py"
      - "tests/test_current_cipo.py"
      - ".github/workflows/current-cipo-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Test observation and fail-closed boundaries
        run: python -m unittest tests.test_current_cipo -v
      - name: Collect bounded current observations for reviewed identities
        run: python scripts/probe_current_cipo.py --detail-limit 10 --output artifacts/current-cipo
      - name: Preserve raw public responses and proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-cipo-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/current-cipo/
          retention-days: 30
          if-no-files-found: warn
