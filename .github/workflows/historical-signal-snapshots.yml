name: Event-time snapshot composition acceptance

on:
  pull_request:
    paths:
      - "src/atlanticbridge/event_time_signals.py"
      - "scripts/build_event_time_snapshots.py"
      - "tests/test_event_time_signals.py"
      - "reviews/backtests/2026-09-21-backtest-entities.json"
      - "reviews/backtests/2026-09-21-signal-source-semantics.json"
      - "reviews/backtests/2026-09-21-cipo-supplemental-evidence.json"
      - "reviews/backtests/2026-09-21-cipo-researcher-manifest.json"
      - "reviews/backtests/2026-09-21-canadabuys-historical-manifest.json"
      - "reviews/backtests/2026-09-21-ted-historical-manifest.json"
      - "reviews/backtests/source_proofs/**"
      - ".github/workflows/historical-signal-snapshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Event-time unit tests
        run: python -m unittest tests.test_event_time_signals -v
      - name: Build snapshots from accepted source proofs
        run: |
          mkdir -p composition-output
          python scripts/build_event_time_snapshots.py \
            --evidence reviews/backtests/source_proofs/2026-09-21-cipo-researcher-evidence.json \
            --evidence reviews/backtests/2026-09-21-cipo-supplemental-evidence.json \
            --evidence reviews/backtests/source_proofs/2026-09-21-canadabuys-evidence.json \
            --evidence reviews/backtests/source_proofs/2026-09-21-ted-evidence.json \
            --combined-evidence-output composition-output/signal-evidence.json \
            --output composition-output/event-time-snapshots.json
      - name: Validate composed source boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshots=json.loads(Path("composition-output/event-time-snapshots.json").read_text())
          cipo=json.loads(Path("reviews/backtests/source_proofs/2026-09-21-cipo-researcher-evidence.json").read_text())
          canada=json.loads(Path("reviews/backtests/source_proofs/2026-09-21-canadabuys-evidence.json").read_text())
          ted=json.loads(Path("reviews/backtests/source_proofs/2026-09-21-ted-evidence.json").read_text())

          assert cipo["known_coverage_gap"]["application_number"] == "1799092"
          assert cipo["known_coverage_gap"]["absence_inference_allowed"] is False
          assert all(row["coverage_status"] == "PRESENCE_ONLY_KNOWN_GAP" for row in cipo["coverage"])
          assert len(cipo["records"]) == 5

          assert canada["semantic_window"]["unique_reference_amendment_keys"] == 105200
          assert canada["semantic_window"]["exact_reviewed_alias_matches"] == 0
          assert all(row["coverage_end_exclusive"] == "2023-06-01" for row in canada["coverage"])

          assert ted["summary"]["entity_alias_query_count"] == 14
          assert ted["summary"]["evidence_record_count"] == 0
          assert all(row["coverage_end_exclusive"] == "2023-06-01" for row in ted["coverage"])

          assert snapshots["summary"] == {
              "entity_count": 12,
              "signal_family_count": 5,
              "snapshot_row_count": 240,
              "state_counts": {
                  "ABSENT_WITH_PROVEN_COVERAGE": 80,
                  "PRESENT": 12,
                  "UNKNOWN_UNVERIFIED_COVERAGE": 148,
              },
              "evaluable_rows_by_signal": {
                  "CANADABUYS_AWARD": 40,
                  "CIPO_CANADIAN_TRADEMARK": 12,
                  "TED_CONTRACT_AWARD": 40,
              },
          }

          cipo_rows=[row for row in snapshots["snapshots"] if row["signal_family"]=="CIPO_CANADIAN_TRADEMARK"]
          assert not any(row["state"]=="ABSENT_WITH_PROVEN_COVERAGE" for row in cipo_rows)
          assert {row["state"] for row in cipo_rows if row["entity_id"].startswith("entrant:78bccec3")} == {"PRESENT"}
          assert {row["state"] for row in cipo_rows if row["entity_id"].startswith("entrant:97847c78")} == {"PRESENT"}
          assert {row["state"] for row in cipo_rows if row["entity_id"]=="control:node:212932"} == {"PRESENT"}
          PY
      - name: Upload compact composition proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-time-composition-${{ github.event.pull_request.head.sha || github.sha }}
          path: composition-output/
          retention-days: 90
          if-no-files-found: error