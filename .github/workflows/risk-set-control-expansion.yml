name: Risk-set control expansion research

on:
  pull_request:
    paths:
      - ".github/workflows/risk-set-control-expansion.yml"
      - "src/atlanticbridge/risk_set_controls.py"
      - "scripts/build_risk_set_controls.py"
      - "reviews/outcome_audit/2026-09-20-outcome-cohorts.json"
      - "reviews/outcome_audit/2026-09-20-cases.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expand-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest tests.test_risk_set_controls -v

      - name: Build expanded live risk set
        run: |
          mkdir -p control-expansion-output
          python scripts/build_risk_set_controls.py \
            --output control-expansion-output/risk-set-controls-expanded.json \
            --manifest-output control-expansion-output/risk-set-controls-expanded.manifest.json \
            --identity-review-output control-expansion-output/risk-set-control-identity-review-expanded.json \
            --max-controls 20 \
            --workers 4

      - name: Validate research-only expansion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "control-expansion-output/risk-set-controls-expanded.json"
              ).read_text()
          )
          review = json.loads(
              Path(
                  "control-expansion-output/"
                  "risk-set-control-identity-review-expanded.json"
              ).read_text()
          )
          accepted = json.loads(
              Path(
                  "reviews/control_cohorts/"
                  "2026-09-20-risk-set-controls.manifest.json"
              ).read_text()
          )

          summary = payload["summary"]
          assert payload["max_controls_per_candidate"] == 20
          assert summary["candidate_count"] == 7
          assert summary["candidates_with_complete_followup"] == 7
          assert summary["negative_labels_created"] == 0
          assert summary["backtest_control_eligible_assignments"] == 0
          assert (
              summary["identity_unreviewed_assignments"]
              == summary["risk_set_candidate_assignments"]
          )

          accepted_summary = accepted["summary"]
          assert accepted["max_controls_per_candidate"] == 5
          assert accepted_summary["risk_set_candidate_assignments"] == 21
          assert accepted_summary["distinct_risk_set_entities"] == 21

          assert (
              summary["risk_set_candidate_assignments"]
              >= accepted_summary["risk_set_candidate_assignments"]
          )
          assert (
              summary["distinct_risk_set_entities"]
              >= accepted_summary["distinct_risk_set_entities"]
          )
          assert review["backtest_control_eligible"] == 0
          assert all(
              row["identity_qualification_status"] == "UNREVIEWED"
              and row["backtest_control_eligible"] is False
              for row in review["records"]
          )

          print("EXPANSION_SUMMARY")
          print(json.dumps(summary, indent=2, sort_keys=True))
          print("EXPANSION_REVIEW_QUEUE")
          print(
              json.dumps(
                  [
                      {
                          "control_entity_key": row["control_entity_key"],
                          "investor_name": row["investor_name"],
                          "investor_locality": row["investor_locality"],
                          "ultimate_control_country":
                              row["ultimate_control_country"],
                          "assigned_candidate_outcome_ids":
                              row["assigned_candidate_outcome_ids"],
                      }
                      for row in review["records"]
                  ],
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Retain expanded research pool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-set-control-expansion-${{ github.event.pull_request.head.sha || github.sha }}
          path: control-expansion-output/
          retention-days: 90
          if-no-files-found: error
