name: Backtest 001 acceptance

on:
  pull_request:
    paths:
      - "src/atlanticbridge/backtest_metrics.py"
      - "scripts/run_backtest_001.py"
      - "tests/test_backtest_001.py"
      - "reviews/backtests/2026-09-21-backtest-001-input.json"
      - "reviews/backtests/2026-09-21-backtest-001.json"
      - "reviews/backtests/2026-09-21-backtest-001.manifest.json"
      - "reviews/backtests/2026-09-21-backtest-entities.json"
      - "reviews/backtests/2026-09-21-signal-source-semantics.json"
      - "reviews/backtests/2026-09-21-cipo-journal-full-manifest.json"
      - "reviews/backtests/2026-09-21-ted-historical-manifest.json"
      - "docs/BACKTEST_001.md"
      - ".github/workflows/backtest-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest tests.test_backtest_001 -v

      - name: Run Backtest 001
        run: |
          mkdir -p backtest-output
          python scripts/run_backtest_001.py \
            --output backtest-output/2026-09-21-backtest-001.json

      - name: Validate fail-closed result
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          result = json.loads(
              Path("backtest-output/2026-09-21-backtest-001.json").read_text()
          )
          summary = result["summary"]
          assert summary["signal_family_count"] == 5
          assert summary["signals_with_any_present_evidence"] == 1
          assert summary["signals_with_proven_absence_coverage"] == 3
          assert summary["signals_with_estimable_false_rates"] == 0
          assert (
              summary["signals_with_identity_eligible_estimable_false_rates"]
              == 3
          )
          assert summary["signals_with_both_positive_and_absence_evidence"] == 1
          assert summary["expansion_score_1_0_weighting_allowed"] is True

          cipo = next(
              row for row in result["signals"]
              if row["signal_family"] == "CIPO_CANADIAN_TRADEMARK"
          )
          assert cipo["state_counts"] == {
              "PRESENT": 12,
              "ABSENT_WITH_PROVEN_COVERAGE": 28,
              "UNKNOWN_UNVERIFIED_COVERAGE": 8,
          }
          assert cipo["source_availability"]["observable_rows"] == 40
          cipo_high = [
              row for row in cipo["identity_confidence_sensitivity"]
              if row["identity_tier"] == "HIGH"
          ]
          assert cipo_high
          assert all(
              row["false_positive_rate"] == 0.2
              and row["false_negative_rate"] == 0.5
              and row["error_rate_status"]
                  == "ESTIMABLE_FOR_CENSORED_ANCHOR_TARGET"
              for row in cipo_high
          )
          cipo_high_or_medium = [
              row for row in cipo["identity_confidence_sensitivity"]
              if row["identity_tier"] == "HIGH_OR_MEDIUM"
          ]
          assert cipo_high_or_medium
          assert all(
              row["false_positive_rate"] == 0.2
              and row["false_negative_rate"] == 0.6
              and row["error_rate_status"]
                  == "ESTIMABLE_FOR_CENSORED_ANCHOR_TARGET"
              for row in cipo_high_or_medium
          )

          canadabuys = next(
              row for row in result["signals"]
              if row["signal_family"] == "CANADABUYS_AWARD"
          )
          assert canadabuys["state_counts"] == {
              "PRESENT": 0,
              "ABSENT_WITH_PROVEN_COVERAGE": 40,
              "UNKNOWN_UNVERIFIED_COVERAGE": 8,
          }
          assert canadabuys["source_availability"]["observable_rows"] == 40
          high_or_medium = [
              row for row in canadabuys["identity_confidence_sensitivity"]
              if row["identity_tier"] == "HIGH_OR_MEDIUM"
          ]
          assert high_or_medium
          assert all(
              row["false_positive_rate"] == 0.0
              and row["false_negative_rate"] == 1.0
              and row["error_rate_status"]
                  == "ESTIMABLE_FOR_CENSORED_ANCHOR_TARGET"
              for row in high_or_medium
          )

          ted = next(
              row for row in result["signals"]
              if row["signal_family"] == "TED_CONTRACT_AWARD"
          )
          assert ted["state_counts"] == {
              "PRESENT": 0,
              "ABSENT_WITH_PROVEN_COVERAGE": 40,
              "UNKNOWN_UNVERIFIED_COVERAGE": 8,
          }
          assert ted["source_availability"]["observable_rows"] == 40
          ted_high_or_medium = [
              row for row in ted["identity_confidence_sensitivity"]
              if row["identity_tier"] == "HIGH_OR_MEDIUM"
          ]
          assert ted_high_or_medium
          assert all(
              row["false_positive_rate"] == 0.0
              and row["false_negative_rate"] == 1.0
              and row["error_rate_status"]
                  == "ESTIMABLE_FOR_CENSORED_ANCHOR_TARGET"
              for row in ted_high_or_medium
          )

          manifest = json.loads(
              Path(
                  "reviews/backtests/2026-09-21-backtest-001.manifest.json"
              ).read_text()
          )
          result_bytes = Path(
              "backtest-output/2026-09-21-backtest-001.json"
          ).read_bytes()
          result_sha256 = hashlib.sha256(result_bytes).hexdigest()
          assert (
              result_sha256
              == manifest["accepted_run"]["generated_result_sha256"]
          ), (
              result_sha256,
              manifest["accepted_run"]["generated_result_sha256"],
          )
          assert summary == {
              **manifest["summary"],
              "score_gate_reason": manifest["score_gate_reason"],
          }

          state_counts = {
              row["signal_family"]: row["state_counts"]
              for row in result["signals"]
          }
          assert state_counts == manifest["signal_state_counts"]

          pinned = Path("reviews/backtests/2026-09-21-backtest-001.json")
          if pinned.exists():
              expected = json.loads(pinned.read_text())
              assert result == expected, "Pinned Backtest 001 output drifted"
          PY

      - name: Retain Backtest 001
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: backtest-output/
          retention-days: 90
          if-no-files-found: error