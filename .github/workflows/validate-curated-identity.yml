name: Validate Curated Identity Queue

on:
  push:
    branches:
      - "feature/curated-identity-013"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run full identity chain and seed curated queue
        run: |
          DB="$RUNNER_TEMP/curated-identity-live.sqlite"

          python -m atlanticbridge ingest-investment-canada \
            --db "$DB" \
            --history \
            --workers 4

          python -m atlanticbridge resolve-entry-identities \
            --db "$DB" \
            --start-month 2019-01 \
            --end-month 2025-12 \
            --gold-limit 100 \
            --detail-limit 140 \
            --detail-delay-seconds 0.05

          python -m atlanticbridge resolve-foreign-identities \
            --db "$DB" \
            --page-size 20 \
            --delay-seconds 0.1

          RESULT="$(python -m atlanticbridge build-curated-identity-queue --db "$DB")"
          echo "$RESULT"

          SUMMARY="$(python -m atlanticbridge summarize-curated-identity --db "$DB")"
          echo "$SUMMARY"

          RESULT="$RESULT" SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESULT"])
          summary = json.loads(os.environ["SUMMARY"])

          assert result["active_queue_records"] == 26, result
          assert result["open_reviews"] == 26, result
          assert result["confirmed_reviews"] == 0, result

          task_counts = {
              row["task_type"]: row["records"]
              for row in result["task_counts"]
          }
          assert task_counts == {
              "CANADIAN_VEHICLE_PARENT": 9,
              "NAMED_INVESTOR_IDENTITY": 16,
              "NAMED_INVESTOR_PARENT": 1,
          }, task_counts

          assert summary["active_queue_records"] == 26, summary
          assert len(summary["queue"]) == 26, summary
          assert all(row["review_status"] == "OPEN" for row in summary["queue"]), summary
          assert all(row["evidence_count"] == 0 for row in summary["queue"]), summary
          PY
