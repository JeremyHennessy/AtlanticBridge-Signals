name: UI usability acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "ui/**"
      - "scripts/build_ui_payload.py"
      - "tests/ui_visual_acceptance.mjs"
      - "tests/workspace_acceptance.mjs"
      - "tests/test_workspace.cjs"
      - ".github/workflows/ui-usability.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ui/**"
      - "scripts/build_ui_payload.py"
      - "tests/ui_visual_acceptance.mjs"
      - "tests/workspace_acceptance.mjs"
      - "tests/test_workspace.cjs"
      - ".github/workflows/ui-usability.yml"

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify payload contract and repeat generation
        run: |
          python -m pip install -e .
          python -m unittest tests.test_ui_payload -v
          python - <<'PY'
          import json, pathlib, subprocess, sys
          p = pathlib.Path('ui/data/dashboard.json')
          original = p.read_bytes()
          subprocess.run([sys.executable, 'scripts/build_ui_payload.py'], check=True)
          generated = p.read_bytes()
          assert json.loads(original) == json.loads(generated), 'Audited payload values changed'
          subprocess.run([sys.executable, 'scripts/build_ui_payload.py'], check=True)
          assert p.read_bytes() == generated, 'Payload generation is not deterministic'
          p.write_bytes(original)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test workspace persistence and evidence semantics
        run: node --test tests/test_workspace.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify all routes, all cases, desktop and phones
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory ui > /tmp/atlanticbridge-ui.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/ui_visual_acceptance.mjs
      - name: Retain acceptance report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-usability-${{ github.sha }}
          path: artifacts/ui-acceptance/
          retention-days: 30
          if-no-files-found: error
