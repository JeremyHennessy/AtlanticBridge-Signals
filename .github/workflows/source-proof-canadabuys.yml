name: CanadaBuys source proof

on:
  pull_request:
    paths:
      - "scripts/collect_backtest_canadabuys.py"
      - "scripts/build_source_proof_artifact.py"
      - "tests/test_canadabuys_backtest_collector.py"
      - "tests/test_source_proof_artifact.py"
      - "reviews/backtests/2026-09-21-backtest-entities.json"
      - "reviews/backtests/source_proofs/2026-09-21-canadabuys-evidence.json"
      - ".github/workflows/source-proof-canadabuys.yml"
  workflow_dispatch:

concurrency:
  group: canadabuys-source-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canadabuys-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest tests.test_canadabuys_backtest_collector tests.test_source_proof_artifact -v
      - name: Restore CanadaBuys cache
        uses: actions/cache@v4
        with:
          path: source-output/canadabuys-cache
          key: canadabuys-award-history-20260921-v1
      - name: Collect CanadaBuys proof
        run: |
          mkdir -p source-output source-proof-output
          python scripts/collect_backtest_canadabuys.py \
            --cache-dir source-output/canadabuys-cache \
            --output source-output/canadabuys-live.json
      - name: Normalize and compare accepted CanadaBuys proof
        run: |
          python scripts/build_source_proof_artifact.py \
            --source canadabuys \
            --input source-output/canadabuys-live.json \
            --output source-proof-output/canadabuys-evidence.json \
            --expected reviews/backtests/source_proofs/2026-09-21-canadabuys-evidence.json
          sha256sum source-proof-output/canadabuys-evidence.json
      - name: Upload compact CanadaBuys proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canadabuys-source-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: source-proof-output/
          retention-days: 90
          if-no-files-found: error