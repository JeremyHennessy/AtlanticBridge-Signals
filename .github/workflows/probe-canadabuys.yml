name: Probe CanadaBuys Awards

on:
  push:
    branches:
      - "feature/canadabuys-007"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe current CanadaBuys award CSV
        run: python scripts/probe_canadabuys.py
