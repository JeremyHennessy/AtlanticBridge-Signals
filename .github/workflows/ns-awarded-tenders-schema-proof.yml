name: Nova Scotia tenders schema proof
on:
  push:
    branches:
      - fix/reliability-archive-pilot-20261104
    paths:
      - scripts/probe_ns_awarded_tenders.py
      - src/atlanticbridge/sources/ns_awarded_tenders.py
      - tests/test_ns_awarded_tenders_collector.py
      - tests/test_ns_awarded_tenders_schema_probe.py
      - .github/workflows/ns-awarded-tenders-schema-proof.yml
permissions:
  contents: read
jobs:
  schema-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline schema-probe tests
        run: python -m unittest discover -s tests -p test_ns_awarded_tenders_schema_probe.py -v
      - name: Read official dataset metadata only
        run: python scripts/probe_ns_awarded_tenders.py
      - name: Install application package for collector tests
        run: python -m pip install .
      - name: Run collector regression tests
        run: python -m unittest discover -s tests -p test_ns_awarded_tenders_collector.py -v
      - name: Run bounded exact-company API smoke
        run: |
          python - <<'PY'
          import json
          from atlanticbridge.sources.ns_awarded_tenders import collect_awarded_tenders_context

          result = collect_awarded_tenders_context("Bell Canada", limit=1)
          assert result["records_returned_by_api"] == 1, "expected a bounded public Bell Canada match"
          assert result["records_matching_exact_vendor"] == 1
          assert result["records_returned_by_api"] <= 1
          assert result["records_matching_exact_vendor"] == len(result["records"])
          assert all(record["vendor"].casefold() == "bell canada" for record in result["records"])
          assert all("tender_description" not in record for record in result["records"])
          print(json.dumps({
              "source": result["source"],
              "records_returned_by_api": result["records_returned_by_api"],
              "records_matching_exact_vendor": result["records_matching_exact_vendor"],
              "page_may_be_truncated": result["page_may_be_truncated"],
              "coverage": result["coverage"],
              "retrieved_at": result["retrieved_at"],
              "raw_record_content_printed": False,
          }, sort_keys=True))
          PY
