name: Validate CanadaBuys Production Ingest

on:
  push:
    branches:
      - "feature/canadabuys-007"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run full live CanadaBuys award ingest
        run: |
          DB="$RUNNER_TEMP/canadabuys-live.sqlite"
          RESULT="$(python -m atlanticbridge ingest-canadabuys-awards --db "$DB")"
          echo "$RESULT"
          SUMMARY="$(python -m atlanticbridge summarize-canadabuys --db "$DB")"
          echo "$SUMMARY"
          RESULT="$RESULT" SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESULT"])
          summary = json.loads(os.environ["SUMMARY"])

          assert result["records"] == 3925, result
          assert result["source_bytes"] == 14079894, result
          assert result["source_sha256"] == "2912c321aed256b9a47122771b726dfecbd69f649ddfdc6c6f69e0c2e52986cd", result
          assert result["eu27_supplier_records"] > 0, result

          assert summary["snapshots"] == 1, summary
          assert summary["current_records"] == 3925, summary
          assert summary["current_eu27_supplier_records"] == result["eu27_supplier_records"], summary
          assert summary["latest_source_sha256"] == result["source_sha256"], summary
          assert summary["latest_source_bytes"] == result["source_bytes"], summary
          assert summary["eu27_by_country"], summary
          assert summary["eu27_suppliers"], summary
          PY
