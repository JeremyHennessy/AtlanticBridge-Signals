name: Live Signals Source Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "src/atlanticbridge/live_signals.py"
      - "src/atlanticbridge/canadabuys_store.py"
      - "src/atlanticbridge/sources/canadabuys.py"
      - "scripts/build_live_signals.py"
      - "tests/test_live_signals.py"
      - ".github/workflows/live-signals-source-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-current-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest tests.test_live_signals -v
      - name: Build current CanadaBuys feed
        run: |
          rm -f /tmp/atlanticbridge-live.sqlite
          python - <<'PY'
          from atlanticbridge.db import connect
          conn=connect("/tmp/atlanticbridge-live.sqlite")
          conn.close()
          PY
          python -m atlanticbridge ingest-canadabuys-awards --db /tmp/atlanticbridge-live.sqlite
          python scripts/build_live_signals.py             --db /tmp/atlanticbridge-live.sqlite             --output artifacts/live-signals.json             --lookback-days 365
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/live-signals.json").read_text())
          assert p["status"] == "ACTIVE"
          assert p["summary"]["signal_count"] > 0
          assert p["summary"]["company_count"] > 0
          assert all(row["signal_family"] == "CANADABUYS_AWARD" for row in p["signals"])
          assert all(row["source_confidence"] == "SOURCE_CONFIRMED" for row in p["signals"])
          print(json.dumps({
              "generated_at":p["generated_at"],
              "source":p["source"],
              "summary":p["summary"],
              "sample":p["signals"][:5],
          }, indent=2))
          PY
      - name: Upload current live feed
        uses: actions/upload-artifact@v4
        with:
          name: live-signals-current-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/live-signals.json
          retention-days: 30
          if-no-files-found: error
