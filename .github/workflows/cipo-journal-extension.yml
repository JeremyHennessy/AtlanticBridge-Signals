name: CIPO Journal 2024 source extension research

on:
  push:
    branches:
      - "research/cipo-journal-extension-*"
  workflow_dispatch:

concurrency:
  group: cipo-journal-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and PDF text extractor
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Parser regression tests
        run: |
          python -m unittest \
            tests.test_cipo_journal \
            tests.test_cipo_journal_full_scan \
            -v

      - name: Prove June 2023 through May 2024 source extension
        run: |
          mkdir -p journal-extension-output
          python scripts/probe_cipo_journal_extension.py \
            --output journal-extension-output/cipo-journal-extension-proof.json

      - name: Enforce source-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path(
                  "journal-extension-output/"
                  "cipo-journal-extension-proof.json"
              ).read_text()
          )
          assert p["design"] == "CIPO_JOURNAL_SOURCE_EXTENSION_PARSE_PROOF"
          assert p["accepted_prefix"]["issue_count"] == 1221
          assert p["accepted_prefix"]["canonical_issue_sha256"] == (
              "8a89eccf0c368e82de4fcd62bea62481930210b7ddf2c182b18e7f45e7521a2d"
          )
          assert p["extension"]["issue_count"] > 0
          assert (
              len(p["issue_audit"])
              == p["extension"]["issue_count"]
          )
          assert p["gate"]["structural_errors"] == []
          assert p["gate"]["issue_failures"] == []
          assert p["gate"]["passed"] is True
          assert p["identity_absence_inference_allowed"] is False
          PY

      - name: Retain compact extension proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipo-journal-extension-${{ github.sha }}
          path: journal-extension-output/
          retention-days: 90
          if-no-files-found: error
