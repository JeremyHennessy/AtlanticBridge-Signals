name: CIPO live applicant probe

on:
  pull_request:
    paths:
      - ".github/workflows/cipo-live-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Probe Sioo historical applicant
        run: |
          python - <<'PY'
          import json
          from atlanticbridge.sources.cipo import CIPOSession, normalize_owner_name

          alias = "SIOO WOODPROTECTION AB"
          expected_application = "1799092"
          session = CIPOSession(timeout=60, attempts=3)
          result = session.search_owner(alias)
          print(json.dumps({
              "owner_query": result.owner_query,
              "num_found": result.num_found,
              "num_returned": result.num_returned,
              "applications": [row.application_number for row in result.records],
          }, indent=2))

          matches = []
          for record in result.records:
              detail = session.fetch_detail(record.record_id)
              facts = json.loads(detail.facts_json)
              applicant = str(facts.get("Applicant") or "").split(" | ", 1)[0]
              if normalize_owner_name(applicant) == normalize_owner_name(alias):
                  matches.append({
                      "record_id": record.record_id,
                      "application_number": detail.application_number,
                      "applicant": applicant,
                      "action_history": list(detail.action_history),
                  })

          print(json.dumps({"exact_applicant_matches": matches}, indent=2))
          assert any(
              row["application_number"] == expected_application
              for row in matches
          ), (
              "Live owner search did not recover known historical applicant "
              f"{expected_application}"
          )
          PY
