name: Probe Corporations Canada

on:
  push:
    branches:
      - "feature/corporations-canada-002"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run full live Corporations Canada baseline
        run: |
          DB="$RUNNER_TEMP/corporations-canada-live.sqlite"
          python -m atlanticbridge ingest-corporations-canada --db "$DB" --mode baseline
          SUMMARY="$(python -m atlanticbridge summarize-corporations-canada --db "$DB")"
          echo "$SUMMARY"
          SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          summary = json.loads(os.environ["SUMMARY"])
          assert summary["active_records"] > 10000, summary
          assert summary["events"] == [], summary
          PY
