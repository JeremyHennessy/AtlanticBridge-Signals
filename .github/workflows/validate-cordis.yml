name: Validate CORDIS Production Ingest

on:
  push:
    branches:
      - "feature/cordis-003-impl"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run full live CORDIS ingest
        run: |
          DB="$RUNNER_TEMP/cordis-live.sqlite"
          python -m atlanticbridge ingest-cordis --db "$DB"
          SUMMARY="$(python -m atlanticbridge summarize-cordis --db "$DB")"
          echo "$SUMMARY"
          SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          summary = json.loads(os.environ["SUMMARY"])
          assert summary["projects"] > 10000, summary
          assert summary["participations"] > 100000, summary
          assert summary["canada_unique_projects"] >= 400, summary
          assert summary["canada_unique_organizations"] >= 150, summary
          assert summary["eu_unique_organizations_on_canada_projects"] >= 2500, summary
          assert summary["canada_eu_shared_projects"] >= 400, summary
          PY
