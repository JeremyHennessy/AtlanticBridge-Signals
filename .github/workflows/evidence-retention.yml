name: Verified evidence retention
on:
  pull_request:
    branches: [main]
    paths: ['scripts/archive_durable.py', 'scripts/archive_admission.py', 'tests/test_archive_durable.py', 'tests/test_archive_admission.py', 'scripts/archive_evidence.py', 'scripts/fetch_accepted_proof.py', 'tests/test_evidence_archive.py', '.github/workflows/evidence-retention.yml', '.github/workflows/pilot-release-proof.yml', 'docs/EVIDENCE_RETENTION_2026_09_22.md']
  push:
    branches: [main]
    paths: ['scripts/archive_durable.py', 'scripts/archive_admission.py', 'tests/test_archive_durable.py', 'tests/test_archive_admission.py', 'scripts/archive_evidence.py', 'scripts/fetch_accepted_proof.py', 'tests/test_evidence_archive.py', '.github/workflows/evidence-retention.yml']
  workflow_run:
    workflows: [Persistent company monitoring]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('archive-proof-{0}', github.event.pull_request.number) || 'company-monitor-production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          node --test tests/test_workspace.cjs tests/test_reviewed.cjs tests/test_opportunities.cjs
  archive:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      # Local proposal only: missing admission state fails closed. Do not dispatch
      # until the historical denial, old runners, and branch policy are reviewed.
      - name: Reserve, archive, and atomically finalize authoritative metadata
        id: archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/archive_evidence.py --report-dir artifacts/retention
      - name: Preserve exact tested code and non-sensitive report
        if: always()
        run: |
          mkdir -p artifacts/retention
          git rev-parse HEAD > artifacts/retention/tested-commit.txt
          git archive --format=tar.gz HEAD > artifacts/retention/tested-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-retention-${{ github.run_id }}
          path: artifacts/retention/
          retention-days: 90
          if-no-files-found: error
      - name: Keep incomplete archive attempts failed
        if: steps.archive.outcome != 'success'
        run: exit 1
