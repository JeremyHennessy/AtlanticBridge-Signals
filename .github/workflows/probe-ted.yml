name: Probe TED Search API

on:
  push:
    branches:
      - "feature/ted-005"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe current TED v3 search response
        run: python scripts/probe_ted.py
