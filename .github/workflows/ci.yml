name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Live Investment Canada source smoke
        run: |
          DB="$RUNNER_TEMP/atlanticbridge-smoke.sqlite"
          python -m atlanticbridge init-db --db "$DB"
          python -m atlanticbridge ingest-investment-canada --db "$DB" --buckets all
          SUMMARY="$(python -m atlanticbridge summarize-investment-canada --db "$DB")"
          echo "$SUMMARY"
          SUMMARY="$SUMMARY" python - <<'PY'
          import json
          import os

          summary = json.loads(os.environ["SUMMARY"])
          assert summary["total_records"] > 0, summary
          assert summary["eu27_records"] > 0, summary
          assert summary["eu27_new_business_records"] > 0, summary
          PY
