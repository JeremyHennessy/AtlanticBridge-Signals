name: Intent announcement preflight (branch only)
on:
  push:
    branches: [feature/intent-validation-delivery-20260922]
    paths: [.github/workflows/intent-announcement-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe robots before requesting announced outcome pages
        run: |
          mkdir -p artifacts/announcements
          python - <<'PY'
          import json, hashlib, urllib.request, urllib.error, urllib.robotparser
          from pathlib import Path
          from datetime import datetime, timezone
          ua='AtlanticBridge-SourceProof/1.0 (+https://github.com/JeremyHennessy/AtlanticBridge-Signals)'
          targets={
            'investcanada':'https://www.investcanada.ca/news',
            'vonage':'https://www.vonage.com/about-us/newsroom/press-releases/Vonage-Launches-Network-Powered-Solutions-for-Fraud-Prevention-Across-Canada/20ad8fcc-1c1d-4777-9315-ccc0168df71a/'
          }
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=25) as r:
              data=r.read(12000001)
              if len(data)>12000000: raise ValueError('oversize response')
              return data,r.url
          results=[]
          for name,url in targets.items():
            row={'id':name,'url':url,'observed_at':datetime.now(timezone.utc).isoformat()}
            try:
              parts=urllib.parse.urlsplit(url)
              robots_url=parts.scheme+'://'+parts.netloc+'/robots.txt'
              raw,final=get(robots_url)
              Path('artifacts/announcements/'+name+'-robots.raw').write_bytes(raw)
              rp=urllib.robotparser.RobotFileParser();rp.parse(raw.decode('utf-8').splitlines())
              row.update(robots_url=robots_url,robots_sha256=hashlib.sha256(raw).hexdigest(),robots_allowed=rp.can_fetch(ua,url))
              if not row['robots_allowed']: raise PermissionError('ROBOTS_DISALLOWED')
              raw,final=get(url)
              Path('artifacts/announcements/'+name+'.raw').write_bytes(raw)
              row.update(status=200,final_url=final,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw))
            except Exception as exc: row['error']=type(exc).__name__+': '+str(exc)
            print(json.dumps(row));results.append(row)
          Path('artifacts/announcements/report.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intent-announcements-${{ github.sha }}
          path: artifacts/announcements/
          retention-days: 7
          if-no-files-found: error
