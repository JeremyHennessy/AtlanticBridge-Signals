name: Debug CIPO LINET Journal layout

on:
  push:
    branches:
      - "debug/cipo-journal-linet-layout-*"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Capture LINET blocks
        run: python scripts/debug_cipo_linet_layout.py
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipo-linet-layout-${{ github.sha }}
          path: debug-output/
          retention-days: 7
          if-no-files-found: error