name: Probe TED Pre-entry Coverage

on:
  push:
    branches:
      - "feature/predictive-feasibility-010"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Measure TED pre-entry coverage
        run: python scripts/probe_ted_preentry.py
