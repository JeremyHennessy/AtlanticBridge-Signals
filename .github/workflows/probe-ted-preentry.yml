name: Probe TED Pre-entry Coverage

on:
  push:
    branches:
      - "feature/predictive-feasibility-010"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 2019-2020
            years: "2019,2020"
          - group: 2021-2022
            years: "2021,2022"
          - group: 2023-2024
            years: "2023,2024"
          - group: 2025
            years: "2025"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Measure TED pre-entry coverage
        env:
          ATLANTICBRIDGE_YEARS: ${{ matrix.years }}
        run: python scripts/probe_ted_preentry.py
